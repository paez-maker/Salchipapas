<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena</title>
<style>
  :root { --bg:#0e1116; --grid:#1a212b; --text:#e8edf2; --muted:#8a96a3; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; top:12px; right:12px; background:#0e1116cc; border:1px solid #2a3340; border-radius:6px; padding:10px 12px; min-width:180px; }
  #hud div { display:flex; justify-content:space-between; gap:16px; }
  #hud .me { font-weight:600; }
  #help { position:fixed; bottom:12px; left:12px; color:var(--muted); }
  #join { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#0e1116ee; }
  #join form { display:flex; gap:8px; }
  #join input, #join button { font:inherit; padding:10px 14px; border-radius:6px; border:1px solid #2a3340; background:#161b22; color:var(--text); }
  #join button { background:#3ddc97; color:#06130d; font-weight:600; cursor:pointer; }
  #join input:focus-visible, #join button:focus-visible { outline:2px solid #4cc9f0; outline-offset:2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="help">Mover: WASD o flechas · Apuntar: ratón · Disparar: clic</div>
<div id="join">
  <form id="f">
    <input id="name" placeholder="Tu nombre" maxlength="16" autofocus>
    <button>Entrar a la arena</button>
  </form>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hud = document.getElementById('hud');
let ws, myId = null, W = 1200, H = 700, state = { p: [], b: [] };
const input = { up:false, down:false, left:false, right:false, shoot:false, angle:0 };

function connect(name) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = () => ws.send(JSON.stringify({ t:'name', name }));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'hello') { myId = m.id; W = m.W; H = m.H; }
    else if (m.t === 'state') state = m;
  };
  ws.onclose = () => { document.getElementById('join').style.display = 'flex'; };
}
document.getElementById('f').onsubmit = (e) => {
  e.preventDefault();
  document.getElementById('join').style.display = 'none';
  connect(document.getElementById('name').value.trim());
};

const keys = { KeyW:'up', ArrowUp:'up', KeyS:'down', ArrowDown:'down', KeyA:'left', ArrowLeft:'left', KeyD:'right', ArrowRight:'right' };
addEventListener('keydown', e => { if (keys[e.code]) input[keys[e.code]] = true; });
addEventListener('keyup',   e => { if (keys[e.code]) input[keys[e.code]] = false; });
addEventListener('mousedown', () => input.shoot = true);
addEventListener('mouseup',   () => input.shoot = false);

let scale = 1, ox = 0, oy = 0;
function resize() {
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  scale = Math.min(cv.width / W, cv.height / H);
  ox = (cv.width - W * scale) / 2; oy = (cv.height - H * scale) / 2;
}
addEventListener('resize', resize); resize();

addEventListener('mousemove', (e) => {
  const me = state.p.find(p => p.id === myId); if (!me) return;
  const mx = (e.clientX * devicePixelRatio - ox) / scale;
  const my = (e.clientY * devicePixelRatio - oy) / scale;
  input.angle = Math.atan2(my - me.y, mx - me.x);
});

// Enviar input 30 veces por segundo
setInterval(() => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t:'input', i: input })); }, 33);

function draw() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#0e1116'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(scale,0,0,scale,ox,oy);
  ctx.fillStyle = '#12171e'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = '#1a212b'; ctx.lineWidth = 1;
  for (let x=0; x<=W; x+=50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0; y<=H; y+=50) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.strokeStyle = '#2a3340'; ctx.lineWidth = 3; ctx.strokeRect(0,0,W,H);

  ctx.fillStyle = '#ffe08a';
  for (const [x,y] of state.b) { ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill(); }

  for (const p of state.p) {
    ctx.globalAlpha = p.d ? 0.25 : 1;
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, 18, 0, 7); ctx.fill();
    if (p.id === myId) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + Math.cos(input.angle)*30, p.y + Math.sin(input.angle)*30); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#e8edf2'; ctx.font = '13px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(p.n, p.x, p.y - 30);
    ctx.fillStyle = '#2a3340'; ctx.fillRect(p.x-20, p.y-26, 40, 4);
    ctx.fillStyle = '#3ddc97'; ctx.fillRect(p.x-20, p.y-26, 40*Math.max(p.hp,0)/100, 4);
  }

  hud.innerHTML = [...state.p].sort((a,b) => b.k - a.k).slice(0,8)
    .map(p => `<div class="${p.id===myId?'me':''}"><span>${p.n.replace(/</g,'&lt;')}</span><span>${p.k} / ${p.de}</span></div>`).join('')
    || 'Conectando…';
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
